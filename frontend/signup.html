<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | SnapClone</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="signup-theme">
    <div class="auth-container">
        <img src="assets/logo.png" alt="SnapClone Logo" style="width: 80px; margin-bottom: 1rem;">
        <h2>Sign Up</h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-group">
            <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password (Min 6 chars)" required>
        </div>
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        </div>
        
        <button id="signupBtn" onclick="signup()">Sign Up</button>

        <button class="google-btn" onclick="googleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Sign up with Google
        </button>

        <div id="messageBox" class="message-box"></div>

        <div class="auth-footer">
            Already have an account? <a href="html/login.html">Log In</a>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById("messageBox");
            box.innerText = text;
            box.className = "message-box " + type;
        }

        async function signup() {
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("signupBtn");

            if (!username || !email || !password || !confirmPassword) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Signing up...";
            showMessage("", "");

            try {
                const response = await fetch("http://localhost:3000/api/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password, confirmPassword })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage("Signup successful! Entering SnapClone...", "success");
                    localStorage.setItem("user", JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = "html/index.html";
                    }, 1500);
                } else {
                    showMessage(data.message, "error");
                }
            } catch (err) {
                showMessage("Connection failed. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign Up";
            }
        }

        function googleLogin() {
            alert("Google OAuth requires a Client ID. Please see the instructions in the implementation plan.");
        }
    </script>
</body>
</html>
