<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Snapii</title>
    <link rel="icon" type="image/png" href="assets/snapii-logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page signup-theme">
    <div class="split-auth-container">
        <!-- Left Side: Branding -->
        <div class="auth-left">
            <img src="assets/snapii-logo.png" alt="Snapii Logo" style="width: 220px;">
            <h1>Snapii</h1>
            <p>The best way to share moments with friends.</p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-right">
            <h2>Create Account</h2>
            <p class="subtitle">Join the SnapClone community today.</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password (Min 6 chars)" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
                </div>
            </div>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
                </div>
            </div>
            
            <button id="signupBtn" onclick="signup()">Sign Up</button>

            <button class="google-btn" onclick="googleSignup()" style="margin-top: 1rem;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign up with Google
            </button>

            <div id="messageBox" class="message-box"></div>

            <div class="auth-footer" style="margin-top: 2rem;">
                Already have an account? <a href="html/login.html">Log In</a>
            </div>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById("messageBox");
            box.innerText = text;
            box.className = "message-box " + type;
        }

        async function signup() {
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("signupBtn");

            if (!username || !email || !password || !confirmPassword) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Creating account...";
            showMessage("", "");

            try {
                const response = await fetch("http://localhost:3000/api/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password, confirmPassword })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage("Signup successful! Entering SnapClone...", "success");
                    localStorage.setItem("user", JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = "html/index.html";
                    }, 1500);
                } else {
                    showMessage(data.message, "error");
                }
            } catch (err) {
                showMessage("Connection failed. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign Up";
            }
        }

        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function googleSignup() {
            alert("Google OAuth requires a Client ID. Please see instructions.");
        }
    </script>
</body>
</html>
