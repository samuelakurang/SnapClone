<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories | Snapii</title>
    <link rel="icon" type="image/png" href="../assets/snapii-logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .stories-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .stories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            color: white;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 1.5rem 0 1rem 0;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* My Story Section */
        .my-story-banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #FFFC00, #FFB800);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 2rem;
        }
        .my-story-banner:hover { transform: scale(1.02); }
        .my-story-content { z-index: 2; color: black; }
        .my-story-content h2 { font-size: 2rem; font-weight: 900; margin: 0; }
        .my-story-content p { font-weight: 600; opacity: 0.8; margin: 5px 0 0 0; }
        .add-story-btn {
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
            background: black; color: white; width: 60px; height: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Stories Row */
        .stories-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }
        .story-card {
            aspect-ratio: 9/16;
            background: #111;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .story-card:hover { transform: translateY(-5px); border-color: var(--snap-blue); }
        .story-preview { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        
        .story-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 15px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white; z-index: 2;
        }
        .author-name { font-weight: 800; font-size: 0.9rem; display: block; }
        .upload-time { font-size: 0.7rem; opacity: 0.7; }
        
        .story-avatar {
            position: absolute; top: 10px; left: 10px;
            width: 35px; height: 35px; border-radius: 50%;
            border: 2px solid var(--snap-yellow); background: #333;
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 0.8rem; z-index: 3; color: white;
        }

        /* Fullscreen Viewer */
        .story-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: none;
            justify-content: center; align-items: center;
        }
        #storyMedia { max-width: 100%; max-height: 100vh; }
        .viewer-header {
            position: absolute; top: 30px; left: 30px;
            color: white; display: flex; align-items: center; gap: 15px;
            z-index: 10001;
        }
        .viewer-close {
            position: absolute; top: 30px; right: 30px;
            color: white; font-size: 2rem; cursor: pointer; z-index: 10002;
        }
        .progress-container {
            position: absolute; top: 15px; left: 15px; right: 15px;
            height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px;
            overflow: hidden; z-index: 10003;
        }
        #progressFill { height: 100%; background: white; width: 0%; }
        .story-caption-overlay {
            position: absolute; bottom: 80px; width: 100%; text-align: center;
            background: rgba(0,0,0,0.5); color: white; padding: 20px;
            font-size: 1.2rem; font-weight: 700; z-index: 10001;
        }

        .empty-state {
            text-align: center; padding: 4rem 0; opacity: 0.5; color: white;
        }
    </style>
</head>
<body style="background-color: var(--app-bg, #000);">
    <div id="toastContainer" class="toast-container"></div>

    <!-- Fullscreen Story Viewer -->
    <div id="storyViewer" class="story-viewer" onclick="closeStory()">
        <div class="progress-container"><div id="progressFill"></div></div>
        <div class="viewer-close"><i class="fas fa-times"></i></div>
        <div class="viewer-header">
            <div id="viewerAvatar" style="width: 45px; height: 45px; border-radius: 50%; background: var(--snap-blue); color: white; display: flex; justify-content: center; align-items: center; font-weight: 800; border: 2px solid white;"></div>
            <div>
                <h3 id="viewerAuthor" style="margin: 0; font-weight: 800;"></h3>
                <p id="viewerTime" style="margin: 0; opacity: 0.8; font-size: 0.8rem;"></p>
            </div>
        </div>
        <img id="storyMedia">
        <div id="storyCaption" class="story-caption-overlay"></div>
    </div>

    <div class="dashboard-container">
        <!-- Navbar Toggle Pill -->
        <div class="navbar-toggle-pill" id="navTogglePill" onclick="toggleNavbar()" title="Toggle Navbar">
            <i class="fas fa-chevron-up" id="navToggleIcon"></i>
        </div>
        <!-- Top Navbar -->
        <nav class="navbar" style="background: #111; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div class="logo" style="display: flex; align-items: center;">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/snapii-logo.png" alt="Snapii Logo">
                </a>
            </div>
            <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                <a href="friends.html" style="color: white;" title="Friends"><i class="fas fa-user-friends" style="cursor: pointer; font-size: 1.2rem;"></i></a>
                <span id="username-display" style="font-weight: 600; color: white;">Guest</span>
                <a href="settings.html" style="color: white;"><i class="fas fa-cog" style="font-size: 1.2rem;"></i></a>
            </div>
        </nav>

        <main class="main-content" style="display: block; overflow-y: auto;">
            <div class="stories-container">
                
                <!-- My Story Banner -->
                <div class="my-story-banner" onclick="location.href='post-story.html'">
                    <div class="my-story-content">
                        <h2>My Story</h2>
                        <p id="myStoryCount">Tap to add a new moment</p>
                    </div>
                    <div class="add-story-btn">
                        <i class="fas fa-plus"></i>
                    </div>
                </div>

                <!-- Global Sidebar -->
                <div class="global-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
                <div class="global-sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <div class="sidebar-title">Snapii Campus</div>
                        <button class="sidebar-close" onclick="toggleSidebar()" style="background:none; border:none; color:white; cursor:pointer;"><i class="fas fa-times"></i></button>
                    </div>
                    <ul class="sidebar-menu">
                        <li><a href="campus.html" class="sidebar-item"><i class="fas fa-university"></i> Campus Feed</a></li>
                        <li><a href="moods.html" class="sidebar-item"><i class="fas fa-smile-beam"></i> Moods</a></li>
                        <li><a href="study-status.html" class="sidebar-item"><i class="fas fa-book-reader"></i> Study Status</a></li>
                        <li><a href="lost-found.html" class="sidebar-item"><i class="fas fa-box-open"></i> Lost & Found</a></li>
                    </ul>
                </div>

                <div id="myActiveStories" style="margin-bottom: 2.5rem;">
                    <!-- User's own active stories will show here -->
                </div>

                <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 2rem 0;">

                <h2 class="section-title"><i class="fas fa-user-friends" style="color: var(--snap-blue);"></i> Friend Stories</h2>
                <div class="stories-row" id="friendsStoriesRow">
                    <!-- Friend stories list -->
                </div>

                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-ghost" style="font-size: 3.5rem; margin-bottom: 1rem;"></i>
                    <p>No stories from friends yet.</p>
                </div>
            </div>
        </main>

        <footer class="bottom-nav">
            <div class="nav-item" onclick="location.href='chat.html'">
                <i class="fas fa-comment"></i>
                <span>Chat</span>
            </div>
            <div class="nav-item center-btn" onclick="location.href='snap.html'">
                <i class="fas fa-camera"></i>
            </div>
            <div class="nav-item active" onclick="location.href='stories.html'">
                <i class="fas fa-circle-notch"></i>
                <span>Stories</span>
            </div>
            <div class="nav-item" onclick="location.href='friends.html'">
                <i class="fas fa-user-plus"></i>
                <span>Friends</span>
            </div>
        </footer>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));
        let allStories = [];
        let viewerTimer = null;

        if (!currentUser) window.location.href = '../login.html';
        document.getElementById('username-display').innerText = currentUser.username;

        // --- NAVBAR TOGGLE ---
        (function() {
            const navbarVisible = localStorage.getItem('navbarVisible') !== 'false';
            const nav = document.querySelector('.navbar');
            const pill = document.getElementById('navTogglePill');
            const icon = document.getElementById('navToggleIcon');
            function apply() {
                nav.classList.toggle('navbar-hidden', !navbarVisible);
                pill.classList.toggle('nav-visible', navbarVisible);
                icon.className = navbarVisible ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
            }
            apply();
            window.toggleNavbar = function() {
                const v = localStorage.getItem('navbarVisible') !== 'false';
                localStorage.setItem('navbarVisible', !v);
                location.reload();
            };
        })();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        async function fetchStories() {
            try {
                const response = await fetch(`http://localhost:3000/api/stories/all/${currentUser.id}`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) {
                    allStories = data.stories;
                    renderStories();
                }
            } catch (err) {
                console.error("Fetch stories failed", err);
            }
        }

        function renderStories() {
            const myContainer = document.getElementById('myActiveStories');
            const friendsRow = document.getElementById('friendsStoriesRow');
            
            const myStories = allStories.filter(s => s.user_id === currentUser.id);
            const friendsStories = allStories.filter(s => s.user_id !== currentUser.id);

            if (myStories.length > 0) {
                document.getElementById('myStoryCount').innerText = `${myStories.length} active moment${myStories.length > 1 ? 's' : ''}`;
                myContainer.innerHTML = `
                    <div class="stories-row">
                        ${myStories.map(s => `
                            <div class="story-card" onclick="viewStory(${s.id})">
                                <img src="http://localhost:3000${s.media_url}" class="story-preview">
                                <div class="story-info">
                                    <span class="author-name">Me</span>
                                    <span class="upload-time">${formatTime(s.created_at)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                myContainer.innerHTML = '';
            }

            if (friendsStories.length > 0) {
                friendsRow.innerHTML = friendsStories.map(s => `
                    <div class="story-card" onclick="viewStory(${s.id})">
                        <div class="story-avatar">${s.username.substring(0,2).toUpperCase()}</div>
                        <img src="http://localhost:3000${s.media_url}" class="story-preview">
                        <div class="story-info">
                            <span class="author-name">${s.username}</span>
                            <span class="upload-time">${formatTime(s.created_at)}</span>
                        </div>
                    </div>
                `).join('');
                document.getElementById('emptyState').style.display = 'none';
            } else {
                friendsRow.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = Math.floor((now - date) / (1000 * 60 * 60));
            if (diffInHours === 0) return 'Just now';
            return `${diffInHours}h ago`;
        }

        function viewStory(id) {
            const s = allStories.find(st => st.id === id);
            if (!s) return;

            const viewer = document.getElementById('storyViewer');
            document.getElementById('storyMedia').src = `http://localhost:3000${s.media_url}`;
            document.getElementById('viewerAuthor').innerText = s.user_id === currentUser.id ? 'Me' : s.username;
            document.getElementById('viewerTime').innerText = new Date(s.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('viewerAvatar').innerText = s.username.substring(0,2).toUpperCase();
            document.getElementById('storyCaption').innerText = s.caption || "";
            
            viewer.style.display = 'flex';
            
            const fill = document.getElementById('progressFill');
            fill.style.transition = 'none';
            fill.style.width = '0%';
            setTimeout(() => {
                fill.style.transition = 'width 5s linear';
                fill.style.width = '100%';
            }, 50);

            clearTimeout(viewerTimer);
            viewerTimer = setTimeout(closeStory, 5000);
        }

        function closeStory() {
            document.getElementById('storyViewer').style.display = 'none';
            document.getElementById('storyMedia').src = "";
            clearTimeout(viewerTimer);
        }

        if (currentUser) {
            fetchStories();
            setInterval(fetchStories, 10000);
        }
    </script>
            <i class="fas fa-map-marked-alt"></i>
            <span>Map</span>
        </div>
        <div class="nav-item" onclick="location.href='chat.html'">
            <i class="fas fa-comment"></i>
            <span>Chat</span>
        </div>
        <div class="nav-item center-btn" onclick="location.href='snap.html'">
            <i class="fas fa-camera"></i>
        </div>
        <div class="nav-item active" onclick="location.href='stories.html'">
            <i class="fas fa-play-circle"></i>
            <span>Stories</span>
        </div>
        <div class="nav-item" onclick="location.href='spotlight.html'">
            <i class="fas fa-play"></i>
            <span>Spotlight</span>
        </div>
    </footer>
</body>
</html>
