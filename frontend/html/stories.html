<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .stories-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .section-header {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 2rem 0 1rem 0;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stories-row {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none; /* Hide scrollbar for clean look */
        }
        .stories-row::-webkit-scrollbar { display: none; }

        .story-card {
            min-width: 130px;
            height: 200px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .story-card:hover { transform: scale(1.05); border-color: var(--snap-blue); }
        .story-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        
        .my-story-add {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .add-icon {
            width: 40px; height: 40px;
            background: var(--snap-blue);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem;
        }

        .story-overlay-info {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .story-badge {
            position: absolute;
            top: 10px; left: 10px;
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2px solid var(--snap-blue);
            background: #333;
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 0.7rem;
            color: white;
            z-index: 2;
        }

        /* Fullscreen Viewer */
        .story-viewer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            display: none;
            justify-content: center; align-items: center;
        }
        #storyMedia { max-width: 100%; max-height: 100vh; }
        .viewer-header {
            position: absolute;
            top: 30px; left: 30px;
            color: white;
            display: flex; align-items: center; gap: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .viewer-close {
            position: absolute;
            top: 30px; right: 30px;
            color: white; font-size: 1.8rem;
            cursor: pointer;
            z-index: 10001;
        }
        .story-progress-bar {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
        }
    </style>
</head>
<body style="background-color: var(--app-bg, #000);">
    <div id="toastContainer" class="toast-container"></div>

    <!-- Fullscreen Story Viewer -->
    <div id="storyViewer" class="story-viewer" onclick="closeStory()">
        <div class="story-progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="viewer-close"><i class="fas fa-times"></i></div>
        <div class="viewer-header">
            <div id="viewerAvatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--snap-yellow); color: black; display: flex; justify-content: center; align-items: center; font-weight: 800;"></div>
            <div>
                <h3 id="storyAuthor" style="margin: 0;"></h3>
                <p id="storyTime" style="margin: 0; opacity: 0.7; font-size: 0.8rem;"></p>
            </div>
        </div>
        <img id="storyMedia">
        <div id="storyCaption" style="position: absolute; bottom: 80px; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.4); padding: 15px; font-weight: 700; font-size: 1.1rem;"></div>
    </div>

    <div class="dashboard-container">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/logo.png" alt="SnapClone Logo" style="width: 35px;">
                    <span>Stories</span>
                </a>
            </div>
            <a href="settings.html" style="color: white;"><i class="fas fa-cog"></i></a>
        </nav>

        <main class="main-content" style="display: block; overflow-y: auto;">
            <div class="stories-container">
                
                <!-- My Stories Section -->
                <div class="section-header">My Story</div>
                <div class="stories-row" id="myStoriesRow">
                    <div class="story-card my-story-add" onclick="location.href='snap.html'">
                        <div class="add-icon"><i class="fas fa-plus"></i></div>
                        <span>Add Story</span>
                    </div>
                    <!-- Own stories will be injected here -->
                </div>

                <!-- Friends Stories Section -->
                <div class="section-header">Friends</div>
                <div class="stories-row" id="friendsStoriesRow">
                    <!-- Friends stories will be injected here -->
                </div>

                <div id="emptyState" style="display: none; text-align: center; margin-top: 5rem; opacity: 0.5; color: white;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                    <p>No stories yet. Be the first to share!</p>
                </div>
            </div>
        </main>

        <footer class="bottom-nav">
            <div class="nav-item" onclick="location.href='chat.html'">
                <i class="fas fa-comment"></i>
                <span>Chat</span>
            </div>
            <div class="nav-item center-btn" onclick="location.href='snap.html'">
                <i class="fas fa-camera"></i>
            </div>
            <div class="nav-item active" onclick="location.href='stories.html'">
                <i class="fas fa-circle-notch"></i>
                <span>Stories</span>
            </div>
            <div class="nav-item" onclick="location.href='friends.html'">
                <i class="fas fa-user-plus"></i>
                <span>Friends</span>
            </div>
        </footer>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));
        let allStories = [];
        let storyTimeout = null;

        async function fetchStories() {
            try {
                const response = await fetch(`http://localhost:3000/api/stories/all/${currentUser.id}`);
                const data = await response.json();
                if (data.success) {
                    allStories = data.stories;
                    renderStories();
                }
            } catch (err) {
                console.error("Stories fetch failed", err);
            }
        }

        function renderStories() {
            const myRow = document.getElementById('myStoriesRow');
            const friendsRow = document.getElementById('friendsStoriesRow');
            
            // Filter own vs friends
            const myStories = allStories.filter(s => s.user_id === currentUser.id);
            const friendsStories = allStories.filter(s => s.user_id !== currentUser.id);

            // Render My Stories (keep the add button)
            const addButton = myRow.querySelector('.my-story-add').outerHTML;
            myRow.innerHTML = addButton + myStories.map(s => `
                <div class="story-card" onclick="viewStoryById(${s.id})">
                    <img src="http://localhost:3000${s.media_url}" class="story-img">
                    <div class="story-overlay-info">Just now</div>
                </div>
            `).join('');

            // Render Friends Stories
            if (friendsStories.length === 0) {
                friendsRow.innerHTML = '<p style="color: #666; font-size: 0.9rem; padding: 10px;">No friends have posted yet.</p>';
            } else {
                friendsRow.innerHTML = friendsStories.map(s => `
                    <div class="story-card" onclick="viewStoryById(${s.id})">
                        <img src="http://localhost:3000${s.media_url}" class="story-img">
                        <div class="story-badge">${s.username.substring(0,2).toUpperCase()}</div>
                        <div class="story-overlay-info">${s.username}</div>
                    </div>
                `).join('');
            }
        }

        function viewStoryById(id) {
            const s = allStories.find(story => story.id === id);
            if (!s) return;

            const viewer = document.getElementById('storyViewer');
            const media = document.getElementById('storyMedia');
            const author = document.getElementById('storyAuthor');
            const time = document.getElementById('storyTime');
            const caption = document.getElementById('storyCaption');
            const avatar = document.getElementById('viewerAvatar');
            const progress = document.getElementById('progressFill');

            media.src = `http://localhost:3000${s.media_url}`;
            author.innerText = s.username;
            time.innerText = new Date(s.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            caption.innerText = s.caption || "";
            avatar.innerText = s.username.substring(0,2).toUpperCase();
            
            viewer.style.display = 'flex';
            
            // Animation for progress bar (5 seconds)
            progress.style.transition = 'none';
            progress.style.width = '0%';
            setTimeout(() => {
                progress.style.transition = 'width 5s linear';
                progress.style.width = '100%';
            }, 50);

            // Auto-close after 5s
            clearTimeout(storyTimeout);
            storyTimeout = setTimeout(closeStory, 5000);
        }

        function closeStory() {
            document.getElementById('storyViewer').style.display = 'none';
            document.getElementById('storyMedia').src = "";
            clearTimeout(storyTimeout);
        }

        // Init
        if (!currentUser) {
            window.location.href = "../login.html";
        } else {
            const savedColor = localStorage.getItem('app-bg') || '#000000';
            document.documentElement.style.setProperty('--app-bg', savedColor);
            fetchStories();
        }
    </script>
</body>
</html>
