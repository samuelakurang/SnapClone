<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found | Snapii</title>
    <link rel="icon" type="image/png" href="../assets/snapii-logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .lf-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .lf-tab {
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            color: #aaa;
            transition: all 0.2s;
        }
        .lf-tab.active, .lf-tab:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .lf-tab.active {
            background: var(--snap-yellow);
            color: black;
        }
        .lf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .lf-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.25s;
            display: flex;
            flex-direction: column;
        }
        .lf-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,252,0,0.3);
        }
        .lf-img-wrap {
            height: 180px;
            width: 100%;
            background: #222;
            position: relative;
        }
        .lf-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .lf-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .lf-badge.lost {
            background: var(--snap-red);
            color: white;
        }
        .lf-badge.found {
            background: #2ecc71;
            color: black;
        }
        .lf-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            width: 500px;
            max-width: 90%;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body style="background-color: var(--app-bg, #000);">

    <!-- Navbar Toggle Pill -->
    <div class="navbar-toggle-pill" id="navTogglePill" onclick="toggleNavbar()" title="Toggle Navbar">
        <i class="fas fa-chevron-up" id="navToggleIcon"></i>
    </div>

    <div class="dashboard-container">
        <!-- Top Navbar -->
        <nav class="navbar" style="background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px);">
            <div class="logo" style="display: flex; align-items: center;">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/snapii-logo.png" alt="Snapii Logo">
                </a>
            </div>
            <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                <a href="friends.html" style="color: white;" title="Friends"><i class="fas fa-user-friends" style="cursor: pointer; font-size: 1.2rem;"></i></a>
                <a href="settings.html" style="color: white;" title="Settings"><i class="fas fa-cog" style="cursor: pointer; font-size: 1.2rem;"></i></a>
                <span id="username-display" style="font-weight: 700;">Student</span>
            </div>
        </nav>

        <div class="main-content" style="padding: 100px 20px 20px 20px; max-width: 1100px; margin: 0 auto; color: white;">
            
            <!-- Header Section -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h1 style="font-weight: 800; font-size: 2.2rem; background: linear-gradient(135deg, #fff, var(--snap-yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">Campus Lost & Found</h1>
                    <p style="color: #888; margin: 5px 0 0 0;">Report lost items or return found belongings to classmates.</p>
                </div>
                <button onclick="openReportModal()" style="background: var(--snap-yellow); color: black; font-weight: 800; padding: 12px 24px; border-radius: 30px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-plus"></i> Report Item
                </button>
            </div>

            <!-- Tabs -->
            <div class="lf-tabs">
                <div class="lf-tab active" onclick="switchLfTab('all', this)">All Items</div>
                <div class="lf-tab" onclick="switchLfTab('lost', this)">Lost</div>
                <div class="lf-tab" onclick="switchLfTab('found', this)">Found</div>
                <div class="lf-tab" onclick="switchLfTab('my', this)">My Reports</div>
            </div>

            <!-- Items Board Grid -->
            <div class="lf-grid" id="itemsGrid">
                <!-- Dynamically loaded -->
                <p style="color: #666; text-align: center; grid-column: 1/-1;">Loading campus directory...</p>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="margin: 0; font-weight: 800;">Report New Item</h3>
                <button onclick="closeReportModal()" style="background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer;"><i class="fas fa-times"></i></button>
            </div>
            
            <form id="reportForm" onsubmit="submitReport(event)">
                <div class="input-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 5px;">Item Title</label>
                    <input type="text" id="reportTitle" placeholder="e.g. Blue Hydroflask, Black Leather Wallet" required style="width: 100%; border-radius: 10px; background: rgba(255,255,255,0.05); color: white; padding: 10px; border: 1px solid rgba(255,255,255,0.1); outline: none;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 1rem;">
                    <div>
                        <label style="font-size: 0.8rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 5px;">Type</label>
                        <select id="reportType" required style="width: 100%; border-radius: 10px; background: #222; color: white; padding: 10px; border: 1px solid rgba(255,255,255,0.1); outline: none;">
                            <option value="lost">Lost</option>
                            <option value="found">Found</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 5px;">Location</label>
                        <input type="text" id="reportLocation" placeholder="e.g. Science Building Hallway" style="width: 100%; border-radius: 10px; background: rgba(255,255,255,0.05); color: white; padding: 10px; border: 1px solid rgba(255,255,255,0.1); outline: none;">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 5px;">Contact Info</label>
                    <input type="text" id="reportContact" placeholder="e.g. Email, phone number, room no." required style="width: 100%; border-radius: 10px; background: rgba(255,255,255,0.05); color: white; padding: 10px; border: 1px solid rgba(255,255,255,0.1); outline: none;">
                </div>

                <div class="input-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 5px;">Item Description</label>
                    <textarea id="reportDescription" placeholder="Add specific descriptions (colors, stickers, brands)..." required style="width: 100%; height: 80px; border-radius: 10px; background: rgba(255,255,255,0.05); color: white; padding: 10px; border: 1px solid rgba(255,255,255,0.1); outline: none;"></textarea>
                </div>

                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label style="font-size: 0.8rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 5px;">Photo</label>
                    <input type="file" id="reportPhoto" accept="image/*" style="width: 100%; color: #aaa;">
                </div>

                <button type="submit" style="width: 100%; padding: 12px; border-radius: 12px; background: var(--snap-yellow); color: black; font-weight: 800; border: none; cursor: pointer;">
                    Submit Report
                </button>
            </form>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="global-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div class="global-sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Snapii Campus</div>
            <button class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="campus.html" class="sidebar-item"><i class="fas fa-university"></i> Campus Feed</a></li>
            <li><a href="moods.html" class="sidebar-item"><i class="fas fa-smile-beam"></i> Moods</a></li>
            <li><a href="study-status.html" class="sidebar-item"><i class="fas fa-book-reader"></i> Study Status</a></li>
            <li><a href="lost-found.html" class="sidebar-item"><i class="fas fa-box-open"></i> Lost & Found</a></li>
        </ul>
        <div class="sidebar-footer">
            Snapii Student Platform v1.0
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';
        document.getElementById('username-display').innerText = user.username;

        let allItems = [];
        let currentTab = 'all';

        function openReportModal() {
            document.getElementById('reportModal').classList.add('open');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('open');
            document.getElementById('reportForm').reset();
        }

        function switchLfTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.lf-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        async function loadItems() {
            try {
                const res = await fetch('http://localhost:3000/api/features/lost-found');
                const data = await res.json();
                if (data.success) {
                    allItems = data.items;
                    renderItems();
                }
            } catch (err) {
                console.error("Error loading items:", err);
            }
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            
            // Filter
            let filtered = allItems;
            if (currentTab === 'lost') {
                filtered = allItems.filter(i => i.item_type === 'lost' && i.status === 'active');
            } else if (currentTab === 'found') {
                filtered = allItems.filter(i => i.item_type === 'found' && i.status === 'active');
            } else if (currentTab === 'my') {
                filtered = allItems.filter(i => i.user_id === user.id);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: #666; text-align: center; grid-column: 1/-1; padding: 3rem;">No items found matching this filter.</p>';
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const imageSrc = item.image_url 
                    ? `http://localhost:3000${item.image_url}`
                    : 'https://images.unsplash.com/photo-1595246140625-573b715d11dc?auto=format&fit=crop&w=400&q=80'; // fallback package mockup/box image
                
                const isOwner = item.user_id === user.id;
                const statusBadge = item.status === 'resolved' 
                    ? `<span style="background: #555; color: #ccc;" class="lf-badge">Resolved</span>`
                    : `<span class="lf-badge ${item.item_type}">${item.item_type}</span>`;
                
                const resolveBtn = (isOwner && item.status === 'active')
                    ? `<button onclick="resolveItem(${item.id})" style="width:100%; margin-top:1rem; padding:10px; background:#e74c3c; color:white; border:none; border-radius:12px; font-weight:800; cursor:pointer;"><i class="fas fa-check-circle"></i> Mark Resolved</button>`
                    : '';

                return `
                    <div class="lf-card">
                        <div class="lf-img-wrap">
                            <img class="lf-img" src="${imageSrc}" alt="${item.title}">
                            ${statusBadge}
                        </div>
                        <div class="lf-content">
                            <div>
                                <h3 style="font-weight: 800; margin: 0 0 10px 0; font-size:1.15rem;">${item.title}</h3>
                                <p style="font-size:0.85rem; color:#aaa; margin: 0 0 10px 0; line-height:1.4;">${item.description}</p>
                            </div>
                            <div style="border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; margin-top:10px;">
                                <p style="font-size:0.8rem; margin:0 0 4px 0;"><i class="fas fa-map-marker-alt" style="color:var(--snap-yellow);"></i> ${item.location || 'Unknown'}</p>
                                <p style="font-size:0.8rem; margin:0 0 4px 0;"><i class="fas fa-phone-alt" style="color:var(--snap-blue);"></i> Contact: ${item.contact}</p>
                                <p style="font-size:0.75rem; color:#555; margin:5px 0 0 0;">Posted by @${item.username}</p>
                                ${resolveBtn}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function submitReport(e) {
            e.preventDefault();
            const title = document.getElementById('reportTitle').value;
            const description = document.getElementById('reportDescription').value;
            const type = document.getElementById('reportType').value;
            const locationVal = document.getElementById('reportLocation').value;
            const contact = document.getElementById('reportContact').value;
            const photoFile = document.getElementById('reportPhoto').files[0];

            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('title', title);
            formData.append('description', description);
            formData.append('item_type', type);
            formData.append('location', locationVal);
            formData.append('contact', contact);
            if (photoFile) {
                formData.append('photo', photoFile);
            }

            try {
                const res = await fetch('http://localhost:3000/api/features/lost-found', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    closeReportModal();
                    loadItems();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Network error submitting report.');
            }
        }

        async function resolveItem(id) {
            if (!confirm('Are you sure you want to mark this item as resolved?')) return;
            try {
                const res = await fetch(`http://localhost:3000/api/features/lost-found/${id}/resolve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id })
                });
                const data = await res.json();
                if (data.success) {
                    loadItems();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Network error resolving item.');
            }
        }

        // Sidebar logic
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // --- NAVBAR TOGGLE ---
        let navbarVisible = localStorage.getItem('navbarVisible') !== 'false';
        const navbar = document.querySelector('.navbar');
        const mainContent = document.querySelector('.main-content');
        const pill = document.getElementById('navTogglePill');
        const pillIcon = document.getElementById('navToggleIcon');

        function applyNavbarState() {
            if (navbarVisible) {
                navbar.classList.remove('navbar-hidden');
                mainContent.classList.remove('nav-hidden');
                pill.classList.add('nav-visible');
                pillIcon.className = 'fas fa-chevron-up';
            } else {
                navbar.classList.add('navbar-hidden');
                mainContent.classList.add('nav-hidden');
                pill.classList.remove('nav-visible');
                pillIcon.className = 'fas fa-chevron-down';
            }
        }

        function toggleNavbar() {
            navbarVisible = !navbarVisible;
            localStorage.setItem('navbarVisible', navbarVisible);
            applyNavbarState();
        }

        applyNavbarState();
        loadItems();
    </script>
</body>
</html>
