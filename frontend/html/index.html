<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapClone | Home</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/logo.png" alt="SnapClone Logo" style="width: 35px;">
                    <span>SnapClone</span>
                </a>
            </div>
            <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                <span id="username-display" style="font-weight: 600;">Guest</span>
                <a href="settings.html" style="color: white;"><i class="fas fa-cog" style="cursor: pointer; font-size: 1.2rem;"></i></a>
            </div>
        </nav>

        <!-- Main Viewport -->
        <main class="main-content">
            <div class="welcome-section">
                <h1>Hi, <span id="welcome-name">User</span>! 👻</h1>
                <p style="opacity: 0.7; margin-top: 10px;">The world is waiting for your moments.</p>
            </div>
        </main>

        <!-- Premium Bottom Navigation -->
        <footer class="bottom-nav">
            <div class="nav-item" onclick="location.href='chat.html'">
                <i class="fas fa-comment"></i>
                <span>Chat</span>
            </div>
            
            <div class="nav-item center-btn active" onclick="location.href='snap.html'">
                <i class="fas fa-camera"></i>
            </div>

            <div class="nav-item" onclick="location.href='stories.html'">
                <i class="fas fa-circle-notch"></i>
                <span>Stories</span>
            </div>
        </footer>
    </div>

    <script>
        // Theme Helper Logic
        function applyTheme() {
            const savedColor = localStorage.getItem('app-bg') || '#000000';
            document.documentElement.style.setProperty('--app-bg', savedColor);
        }

        // Check if user is logged in
        const userData = localStorage.getItem("user");
        if (!userData) {
            window.location.href = "login.html";
        } else {
            const user = JSON.parse(userData);
            document.getElementById("username-display").innerText = user.username;
            document.getElementById("welcome-name").innerText = user.username;
        }

        applyTheme();
    </script>
</body>
</html>
