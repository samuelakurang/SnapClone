<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/logo.png" alt="SnapClone Logo" style="width: 35px;">
                    <span>Chat</span>
                </a>
            </div>
            <a href="settings.html" style="color: white;"><i class="fas fa-cog"></i></a>
        </nav>

        <main class="main-content">
            <div style="text-align: center; opacity: 0.5;">
                <i class="fas fa-comment-slash" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                <h2>No Chats Yet</h2>
                <p>Your recent conversations will appear here.</p>
            </div>
        </main>

        <footer class="bottom-nav">
            <div class="nav-item active" onclick="location.href='chat.html'">
                <i class="fas fa-comment"></i>
                <span>Chat</span>
            </div>
            <div class="nav-item center-btn" onclick="location.href='snap.html'">
                <i class="fas fa-camera"></i>
            </div>
            <div class="nav-item" onclick="location.href='stories.html'">
                <i class="fas fa-circle-notch"></i>
                <span>Stories</span>
            </div>
        </footer>
    </div>
    <script>
        const savedColor = localStorage.getItem('app-bg') || '#000000';
        document.documentElement.style.setProperty('--app-bg', savedColor);
    </script>
</body>
</html>
