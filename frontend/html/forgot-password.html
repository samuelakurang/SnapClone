<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-theme">
    <div class="auth-container">
        <a href="index.html" style="text-decoration: none;"><img src="../assets/logo.png" alt="SnapClone Logo" style="width: 80px; margin-bottom: 1rem;"></a>
        <h2>Reset Password</h2>
        <p style="margin-bottom: 1.5rem; color: #666; font-size: 0.9rem;">
            Enter your email and a new password to reset your account.
        </p>
        <div class="input-group">
            <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="password" id="newPassword" placeholder="New Password (Min 6 chars)" required>
        </div>
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
        </div>
        
        <button id="resetBtn" onclick="resetPassword()">Reset Password</button>

        <div id="messageBox" class="message-box"></div>

        <div class="auth-footer">
            Remembered your password? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById("messageBox");
            box.innerText = text;
            box.className = "message-box " + type;
        }

        async function resetPassword() {
            const email = document.getElementById("email").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("resetBtn");

            if (!email || !newPassword || !confirmPassword) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            if (newPassword.length < 6) {
                showMessage("Password must be at least 6 characters", "error");
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Resetting...";
            showMessage("", "");

            try {
                const response = await fetch("http://localhost:3000/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, newPassword })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage("Password updated successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    showMessage(data.message, "error");
                }
            } catch (err) {
                showMessage("Connection failed. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Reset Password";
            }
        }
    </script>
</body>
</html>
