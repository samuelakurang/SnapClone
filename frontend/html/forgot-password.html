<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-theme">
    <div class="split-auth-container">
        <!-- Left Side: Branding -->
        <div class="auth-left login-brand">
            <img src="../assets/logo.png" alt="SnapClone Logo" style="width: 120px;">
            <h1>Recover Account</h1>
            <p>Don't worry, we'll get you back in no time.</p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-right">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email and new password.</p>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="New Password (Min 6 chars)" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('newPassword', this)"></i>
                </div>
            </div>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
                </div>
            </div>

            <button id="resetBtn" onclick="resetPassword()">Reset Password</button>

            <div id="messageBox" class="message-box"></div>

            <div class="auth-footer" style="margin-top: 2rem;">
                Remembered your password? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById("messageBox");
            box.innerText = text;
            box.className = "message-box " + type;
        }

        async function resetPassword() {
            const email = document.getElementById("email").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("resetBtn");

            if (!email || !newPassword || !confirmPassword) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            if (newPassword.length < 6) {
                showMessage("Password must be at least 6 characters", "error");
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Resetting...";
            showMessage("", "");

            try {
                const response = await fetch("http://localhost:3000/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, newPassword })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage("Password updated successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    showMessage(data.message, "error");
                }
            } catch (err) {
                showMessage("Connection failed. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Reset Password";
            }
            function togglePassword(id, icon) {
                const input = document.getElementById(id);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }
    </script>
</body>

</html>
