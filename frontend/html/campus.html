<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapii | Campus Feed</title>
    <link rel="icon" type="image/png" href="../assets/snapii-logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #050505; }
        
        .campus-container {
            max-width: 600px;
            margin: 80px auto 100px auto; /* space for top and bottom navs */
            padding: 20px;
        }

        /* Create Post Box */
        .create-post-box {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .post-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            resize: none;
            min-height: 80px;
            font-family: inherit;
        }

        .post-textarea:focus { outline: none; }

        .post-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .media-upload-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .media-upload-btn:hover { background: rgba(255,255,255,0.2); }

        .submit-post-btn {
            background: var(--snap-blue);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-post-btn:hover { transform: scale(1.05); }
        .submit-post-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Media Preview */
        .media-preview-container {
            position: relative;
            margin-top: 15px;
            display: none;
        }
        .media-preview-container img, .media-preview-container video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
        }
        .remove-media-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Post Card */
        .campus-post {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .author-avatar {
            width: 45px;
            height: 45px;
            background: var(--snap-yellow);
            color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
        }

        .author-name {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .post-time {
            font-size: 0.8rem;
            color: #777;
        }

        .post-content {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .post-media {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
        }

        /* Post Footer / Actions */
        .post-footer {
            display: flex;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .interaction-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .interaction-btn:hover { color: white; }
        .interaction-btn.liked { color: var(--snap-red); }

        .delete-btn {
            color: #555;
            background: none;
            border: none;
            cursor: pointer;
        }
        .delete-btn:hover { color: var(--snap-red); }

        /* Comments Section */
        .comments-section {
            margin-top: 15px;
            display: none; /* hidden by default */
        }
        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 15px;
        }
        .comment-avatar {
            width: 30px; height: 30px;
            background: var(--snap-blue);
            color: white;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 0.9rem;
            flex-shrink: 0;
        }
        .comment-body { flex-grow: 1; }
        .comment-author { font-weight: bold; font-size: 0.9rem; margin-bottom: 3px; }
        .comment-text { font-size: 0.95rem; }
        
        .add-comment-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .add-comment-input {
            flex-grow: 1;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
        }
        .add-comment-input:focus { outline: none; background: rgba(255,255,255,0.15); }
        .add-comment-btn {
            background: var(--snap-blue);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="dashboard-page">
    <div id="toastContainer" class="toast-container"></div>
    <!-- Navbar Toggle Pill -->
    <div class="navbar-toggle-pill" id="navTogglePill" onclick="toggleNavbar()" title="Toggle Navbar">
        <i class="fas fa-chevron-up" id="navToggleIcon"></i>
    </div>
    
    <div class="dashboard-container">
        <!-- Top Navbar -->
        <nav class="navbar" style="background: #111; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div class="logo" style="display: flex; align-items: center;">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/snapii-logo.png" alt="Snapii Logo">
                </a>
            </div>
            <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                <a href="friends.html" style="color: white;" title="Friends"><i class="fas fa-user-friends" style="font-size: 1.2rem;"></i></a>
                <a href="settings.html" style="color: white;"><i class="fas fa-cog"></i></a>
            </div>
        </nav>

        <!-- Main Campus View -->
        <main class="main-content" style="padding: 0; display: block; overflow-y: auto;">
            <div class="campus-container">
                
                <h1 style="font-weight: 800; margin-bottom: 20px;">Campus Feed <i class="fas fa-university" style="color: var(--snap-yellow);"></i></h1>

                <!-- Create Post Box -->
                <div class="create-post-box">
                    <textarea id="postText" class="post-textarea" placeholder="What's happening on campus?"></textarea>
                    
                    <div class="media-preview-container" id="mediaPreviewContainer">
                        <img id="imgPreview" style="display: none;">
                        <video id="vidPreview" autoplay loop muted playsinline style="display: none;"></video>
                        <button class="remove-media-btn" onclick="removeMedia()"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="post-actions-row">
                        <button class="media-upload-btn" onclick="document.getElementById('mediaInput').click()">
                            <i class="far fa-image"></i> Photo/Video
                        </button>
                        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelect(event)">
                        
                        <button class="submit-post-btn" id="submitPostBtn" onclick="submitPost()">Post</button>
                    </div>
                </div>

                <!-- Feed Container -->
                <div id="campusFeed">
                    <!-- Posts load here -->
                    <div style="text-align: center; padding: 50px; color: #777;">
                        <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem;"></i>
                    </div>
                </div>

            </div>
        </main>

        <!-- Bottom Navigation -->
        <footer class="bottom-nav">
            <div class="nav-item" onclick="location.href='location.html'">
                <i class="fas fa-map-marked-alt"></i>
                <span>Map</span>
            </div>
            <div class="nav-item" onclick="location.href='chat.html'">
                <i class="fas fa-comment"></i>
                <span>Chat</span>
            </div>
            <div class="nav-item center-btn" onclick="location.href='snap.html'">
                <i class="fas fa-camera"></i>
            </div>
            <div class="nav-item" onclick="location.href='stories.html'">
                <i class="fas fa-play-circle"></i>
                <span>Stories</span>
            </div>
            <div class="nav-item" onclick="location.href='spotlight.html'">
                <i class="fas fa-play"></i>
                <span>Spotlight</span>
            </div>
        </footer>
    </div>

    <!-- Global Sidebar -->
    <div class="global-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="global-sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Snapii Campus</div>
            <button class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="campus.html" class="sidebar-item" style="background: rgba(255,255,255,0.05); border-left: 3px solid var(--snap-blue);"><i class="fas fa-university"></i> Campus Feed</a></li>
            <li><a href="moods.html" class="sidebar-item"><i class="fas fa-smile-beam"></i> Moods</a></li>
            <li><a href="study-status.html" class="sidebar-item"><i class="fas fa-book-reader"></i> Study Status</a></li>
            <li><a href="lost-found.html" class="sidebar-item"><i class="fas fa-box-open"></i> Lost & Found</a></li>
        </ul>
        <div class="sidebar-footer">
            Snapii Student Platform v1.0
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = '../login.html';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // --- NAVBAR TOGGLE ---
        (function() {
            const navbarVisible = localStorage.getItem('navbarVisible') !== 'false';
            const nav = document.querySelector('.navbar');
            const pill = document.getElementById('navTogglePill');
            const icon = document.getElementById('navToggleIcon');
            nav.classList.toggle('navbar-hidden', !navbarVisible);
            pill.classList.toggle('nav-visible', navbarVisible);
            icon.className = navbarVisible ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
            window.toggleNavbar = function() {
                const v = localStorage.getItem('navbarVisible') !== 'false';
                localStorage.setItem('navbarVisible', !v);
                location.reload();
            };
        })();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function timeSince(dateString) {
            const date = new Date(dateString);
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m ago";
            return "Just now";
        }

        // --- POST CREATION LOGIC ---
        let selectedFile = null;

        function handleMediaSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedFile = file;

            const url = URL.createObjectURL(file);
            document.getElementById('mediaPreviewContainer').style.display = 'block';
            
            const imgPreview = document.getElementById('imgPreview');
            const vidPreview = document.getElementById('vidPreview');

            if (file.type.startsWith('video/')) {
                imgPreview.style.display = 'none';
                vidPreview.src = url;
                vidPreview.style.display = 'block';
            } else {
                vidPreview.style.display = 'none';
                imgPreview.src = url;
                imgPreview.style.display = 'block';
            }
        }

        function removeMedia() {
            selectedFile = null;
            document.getElementById('mediaInput').value = '';
            document.getElementById('mediaPreviewContainer').style.display = 'none';
            document.getElementById('vidPreview').pause();
        }

        async function submitPost() {
            const content = document.getElementById('postText').value.trim();
            if (!content && !selectedFile) {
                showToast("Post cannot be empty", "error");
                return;
            }

            const btn = document.getElementById('submitPostBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const formData = new FormData();
            formData.append('user_id', user.id);
            if (content) formData.append('content', content);
            if (selectedFile) formData.append('media', selectedFile);

            try {
                const res = await fetch('http://localhost:3000/api/campus/post', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('postText').value = '';
                    removeMedia();
                    fetchFeed(); // Refresh feed
                    showToast("Posted to Campus!");
                } else {
                    showToast(data.message || "Failed to post", "error");
                }
            } catch (err) {
                showToast("Connection error", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Post';
            }
        }

        // --- FEED RENDERING LOGIC ---
        async function fetchFeed() {
            try {
                const res = await fetch('http://localhost:3000/api/campus/feed', { credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    renderFeed(data.feed, data.userLikes);
                }
            } catch (err) {
                console.error("Failed to load campus feed");
            }
        }

        function renderFeed(posts, userLikes) {
            const container = document.getElementById('campusFeed');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = `<div style="text-align:center; color: #777; padding: 30px;">Be the first to post!</div>`;
                return;
            }

            posts.forEach(post => {
                const isLiked = userLikes.includes(post.id);
                const isMyPost = post.author_id === user.id;

                let mediaHtml = '';
                if (post.media_url) {
                    if (post.media_url.match(/\.(mp4|webm|ogg)$/i)) {
                        mediaHtml = `<video class="post-media" src="http://localhost:3000${post.media_url}" controls></video>`;
                    } else {
                        mediaHtml = `<img class="post-media" src="http://localhost:3000${post.media_url}" alt="Post Media">`;
                    }
                }

                const postEl = document.createElement('div');
                postEl.className = 'campus-post';
                postEl.innerHTML = `
                    <div class="post-header">
                        <div class="author-info">
                            <div class="author-avatar">${post.username.charAt(0).toUpperCase()}</div>
                            <div>
                                <div class="author-name">@${post.username}</div>
                                <div class="post-time">${timeSince(post.created_at)}</div>
                            </div>
                        </div>
                        ${isMyPost ? `<button class="delete-btn" onclick="deletePost(${post.id})"><i class="fas fa-trash-alt"></i></button>` : ''}
                    </div>
                    ${post.content ? `<div class="post-content">${post.content}</div>` : ''}
                    ${mediaHtml}
                    <div class="post-footer">
                        <button class="interaction-btn ${isLiked ? 'liked' : ''}" id="like-btn-${post.id}" onclick="toggleLike(${post.id})">
                            <i class="fas fa-heart"></i> <span id="like-count-${post.id}">${post.likes_count}</span>
                        </button>
                        <button class="interaction-btn" onclick="toggleComments(${post.id})">
                            <i class="fas fa-comment"></i> <span id="comment-count-${post.id}">${post.comments_count}</span>
                        </button>
                    </div>
                    
                    <!-- Comments Section -->
                    <div class="comments-section" id="comments-${post.id}">
                        <div id="comments-list-${post.id}"></div>
                        <div class="add-comment-box">
                            <input type="text" id="comment-input-${post.id}" class="add-comment-input" placeholder="Write a comment..." onkeypress="handleCommentEnter(event, ${post.id})">
                            <button class="add-comment-btn" onclick="submitComment(${post.id})"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(postEl);
            });
        }

        // --- INTERACTION LOGIC ---
        async function deletePost(id) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            try {
                const res = await fetch(`http://localhost:3000/api/campus/post/${id}`, { method: 'DELETE', credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    showToast("Post deleted");
                    fetchFeed();
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleLike(id) {
            try {
                const res = await fetch(`http://localhost:3000/api/campus/post/${id}/like`, { method: 'POST', credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    const btn = document.getElementById(`like-btn-${id}`);
                    const count = document.getElementById(`like-count-${id}`);
                    count.innerText = data.likes_count;
                    if (data.liked) btn.classList.add('liked');
                    else btn.classList.remove('liked');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            if (section.style.display === 'block') {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                loadComments(postId);
            }
        }

        async function loadComments(postId) {
            const list = document.getElementById(`comments-list-${postId}`);
            list.innerHTML = '<div style="text-align:center; font-size:0.8rem; color:#777;">Loading...</div>';
            try {
                const res = await fetch(`http://localhost:3000/api/campus/post/${postId}/comments`);
                const data = await res.json();
                if (data.success) {
                    list.innerHTML = '';
                    data.comments.forEach(c => {
                        list.innerHTML += `
                            <div class="comment-item">
                                <div class="comment-avatar">${c.username.charAt(0).toUpperCase()}</div>
                                <div class="comment-body">
                                    <div class="comment-author">@${c.username}</div>
                                    <div class="comment-text">${c.content}</div>
                                </div>
                            </div>
                        `;
                    });
                    if (data.comments.length === 0) {
                        list.innerHTML = '<div style="font-size:0.8rem; color:#777; margin-bottom: 10px;">No comments yet. Be the first!</div>';
                    }
                }
            } catch (err) {
                list.innerHTML = 'Error loading comments.';
            }
        }

        function handleCommentEnter(e, postId) {
            if (e.key === 'Enter') submitComment(postId);
        }

        async function submitComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`http://localhost:3000/api/campus/post/${postId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    loadComments(postId);
                    // Update count visually
                    const countEl = document.getElementById(`comment-count-${postId}`);
                    countEl.innerText = parseInt(countEl.innerText) + 1;
                }
            } catch (err) {
                showToast("Failed to comment", "error");
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', fetchFeed);
    </script>
</body>
</html>
