<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-theme">
    <div class="auth-container">
        <a href="index.html" style="text-decoration: none;"><img src="../assets/logo.png" alt="SnapClone Logo" style="width: 80px; margin-bottom: 1rem;"></a>
        <h2>Log In</h2>
        <div class="input-group">
            <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
        </div>
        
        <button id="loginBtn" onclick="login()">Log In</button>

        <button class="google-btn" onclick="googleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Log in with Google
        </button>

        <div id="messageBox" class="message-box"></div>

        <div class="auth-footer">
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
            <br>
            Don't have an account? <a href="../signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById("messageBox");
            box.innerText = text;
            box.className = "message-box " + type;
        }

        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");

            if (!email || !password) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Logging in...";
            showMessage("", "");

            try {
                const response = await fetch("http://localhost:3000/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage("Login successful!", "success");
                    localStorage.setItem("user", JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    showMessage(data.message, "error");
                }
            } catch (err) {
                showMessage("Connection failed. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Log In";
            }
        }

        function googleLogin() {
            alert("Google OAuth requires a Client ID. Please see the instructions in the implementation plan.");
        }
    </script>
</body>
</html>
