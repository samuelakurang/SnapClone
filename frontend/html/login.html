<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-theme">
    <div class="split-auth-container">
        <!-- Left Side: Branding -->
        <div class="auth-left login-brand">
            <img src="../assets/logo.png" alt="SnapClone Logo" style="width: 120px;">
            <h1>Welcome Back</h1>
            <p>Log in to pick up where you left off.</p>
        </div>

        <!-- Right Side: Form -->
        <div class="auth-right">
            <h2>Log In</h2>
            <p class="subtitle">Enter your credentials to access your account.</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
                </div>
            </div>
            
            <button id="loginBtn" onclick="login()">Log In</button>

            <button class="google-btn" onclick="googleLogin()" style="margin-top: 1rem;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Log in with Google
            </button>

            <div id="messageBox" class="message-box"></div>

            <div class="auth-footer" style="margin-top: 2rem;">
                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                <br><br>
                Don't have an account? <a href="../signup.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById("messageBox");
            box.innerText = text;
            box.className = "message-box " + type;
        }

        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");

            if (!email || !password) {
                showMessage("Please fill in all fields", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Logging in...";
            showMessage("", "");

            try {
                const response = await fetch("http://localhost:3000/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage("Login successful!", "success");
                    localStorage.setItem("user", JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    showMessage(data.message, "error");
                }
            } catch (err) {
                showMessage("Connection failed. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Log In";
            }
        }

        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function googleLogin() {
            alert("Google OAuth requires a Client ID.");
        }
    </script>
</body>
</html>
