<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Moods | Snapii</title>
    <link rel="icon" type="image/png" href="../assets/snapii-logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 1.5rem;
        }
        .mood-preset-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .mood-preset-card:hover, .mood-preset-card.selected {
            background: var(--snap-yellow);
            color: black;
            transform: translateY(-5px);
            border-color: var(--snap-yellow);
        }
        .mood-preset-card .emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 5px;
        }
        .mood-preset-card .label {
            font-size: 0.8rem;
            font-weight: 700;
        }
        .mood-feed-container {
            margin-top: 2rem;
        }
        .mood-item-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .mood-item-card:hover {
            transform: scale(1.01);
            background: rgba(255,255,255,0.06);
        }
        .mood-badge {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body style="background-color: var(--app-bg, #000);">

    <!-- Navbar Toggle Pill -->
    <div class="navbar-toggle-pill" id="navTogglePill" onclick="toggleNavbar()" title="Toggle Navbar">
        <i class="fas fa-chevron-up" id="navToggleIcon"></i>
    </div>

    <div class="dashboard-container">
        <!-- Top Navbar -->
        <nav class="navbar" style="background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px);">
            <div class="logo" style="display: flex; align-items: center;">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/snapii-logo.png" alt="Snapii Logo">
                </a>
            </div>
            <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                <a href="friends.html" style="color: white;" title="Friends"><i class="fas fa-user-friends" style="cursor: pointer; font-size: 1.2rem;"></i></a>
                <a href="settings.html" style="color: white;" title="Settings"><i class="fas fa-cog" style="cursor: pointer; font-size: 1.2rem;"></i></a>
                <span id="username-display" style="font-weight: 700;">Student</span>
            </div>
        </nav>

        <div class="main-content" style="padding: 100px 20px 20px 20px; max-width: 800px; margin: 0 auto; color: white;">
            
            <!-- Headline -->
            <div style="margin-bottom: 2rem; text-align: center;">
                <h1 style="font-weight: 800; font-size: 2.2rem; background: linear-gradient(135deg, #fff, var(--snap-yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Campus Moods</h1>
                <p style="color: #888;">Share how you feel today and see the vibe on campus.</p>
            </div>

            <!-- Set Mood Card -->
            <div class="chat-header" style="border-radius: 24px; padding: 2rem; margin-bottom: 2rem; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);">
                <h3 style="margin-bottom: 1.2rem; font-weight: 800;"><i class="fas fa-pen-fancy" style="color: var(--snap-yellow);"></i> Set Your Mood</h3>
                
                <!-- Mood Presets -->
                <div class="mood-grid">
                    <div class="mood-preset-card" onclick="selectMood('Happy', '😃')">
                        <span class="emoji">😃</span>
                        <span class="label">Happy</span>
                    </div>
                    <div class="mood-preset-card" onclick="selectMood('Tired', '😴')">
                        <span class="emoji">😴</span>
                        <span class="label">Tired</span>
                    </div>
                    <div class="mood-preset-card" onclick="selectMood('Studying', '📚')">
                        <span class="emoji">📚</span>
                        <span class="label">Studying</span>
                    </div>
                    <div class="mood-preset-card" onclick="selectMood('Chill', '😎')">
                        <span class="emoji">😎</span>
                        <span class="label">Chill</span>
                    </div>
                    <div class="mood-preset-card" onclick="selectMood('Stressed', '🤯')">
                        <span class="emoji">🤯</span>
                        <span class="label">Stressed</span>
                    </div>
                    <div class="mood-preset-card" onclick="selectMood('Hungry', '🍕')">
                        <span class="emoji">🍕</span>
                        <span class="label">Hungry</span>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 1rem;">
                    <input type="text" id="moodComment" placeholder="Add a status update... (e.g. 'Struggling with maths homework')" style="width: 100%; border-radius: 12px; background: rgba(255,255,255,0.05); color: white; padding: 12px 18px; border: 1px solid rgba(255,255,255,0.1); outline: none;">
                </div>

                <button id="updateMoodBtn" onclick="updateMood()" style="width: 100%; padding: 12px; border-radius: 12px; background: var(--snap-yellow); color: black; font-weight: 800; font-size: 1rem;">
                    Update Status
                </button>
            </div>

            <!-- Campus Mood Board -->
            <div class="mood-feed-container">
                <h3 style="margin-bottom: 1.5rem; font-weight: 800;"><i class="fas fa-users" style="color: var(--snap-blue);"></i> Student Mood Board</h3>
                <div id="moodList">
                    <!-- Loaded dynamically -->
                    <p style="color: #666; text-align: center;">Loading campus vibes...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="global-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div class="global-sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Snapii Campus</div>
            <button class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="campus.html" class="sidebar-item"><i class="fas fa-university"></i> Campus Feed</a></li>
            <li><a href="moods.html" class="sidebar-item"><i class="fas fa-smile-beam"></i> Moods</a></li>
            <li><a href="study-status.html" class="sidebar-item"><i class="fas fa-book-reader"></i> Study Status</a></li>
            <li><a href="lost-found.html" class="sidebar-item"><i class="fas fa-box-open"></i> Lost & Found</a></li>
        </ul>
        <div class="sidebar-footer">
            Snapii Student Platform v1.0
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';
        document.getElementById('username-display').innerText = user.username;

        let activeMood = '';
        let activeEmoji = '';

        function selectMood(mood, emoji) {
            activeMood = mood;
            activeEmoji = emoji;
            document.querySelectorAll('.mood-preset-card').forEach(card => {
                card.classList.remove('selected');
                if (card.querySelector('.label').innerText === mood) {
                    card.classList.add('selected');
                }
            });
        }

        async function updateMood() {
            if (!activeMood) {
                alert('Please select a mood preset first.');
                return;
            }
            const moodText = document.getElementById('moodComment').value;
            const btn = document.getElementById('updateMoodBtn');
            btn.disabled = true;
            btn.innerText = 'Updating...';

            try {
                const res = await fetch('http://localhost:3000/api/features/mood', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        current_mood: activeMood,
                        mood_emoji: activeEmoji,
                        mood_text: moodText
                    })
                });
                const data = await res.json();
                if (data.success) {
                    // Update local storage representation
                    user.current_mood = activeMood;
                    user.mood_emoji = activeEmoji;
                    user.mood_text = moodText;
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    document.getElementById('moodComment').value = '';
                    loadMoodFeed();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Network error updating mood.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Update Status';
            }
        }

        async function loadMoodFeed() {
            try {
                const res = await fetch('http://localhost:3000/api/features/moods?user_id=' + user.id);
                const data = await res.json();
                if (data.success) {
                    const moodList = document.getElementById('moodList');
                    if (data.moods.length === 0) {
                        moodList.innerHTML = '<p style="color: #666; text-align: center; padding: 2rem;">No statuses shared today. Be the first!</p>';
                        return;
                    }

                    moodList.innerHTML = data.moods.map(m => {
                        const avatarHtml = m.avatar_url 
                            ? `<img src="http://localhost:3000${m.avatar_url}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--snap-yellow);">`
                            : `<div class="avatar" style="width: 50px; height: 50px; font-size: 1.2rem; background: var(--snap-yellow); color: black; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-weight: 700;">${m.username.charAt(0).toUpperCase()}</div>`;
                        
                        const timeString = new Date(m.mood_updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        
                        return `
                            <div class="mood-item-card">
                                ${avatarHtml}
                                <div style="flex-grow: 1;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                        <h4 style="font-weight: 700; margin: 0;">@${m.username}</h4>
                                        <span style="font-size: 0.8rem; color: #666;">${timeString}</span>
                                    </div>
                                    <div style="margin-bottom: 6px;">
                                        <span class="mood-badge">${m.mood_emoji} ${m.current_mood}</span>
                                    </div>
                                    ${m.mood_text ? `<p style="margin: 0; color: #ddd; font-size: 0.95rem;">${m.mood_text}</p>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("Error loading mood feed:", err);
            }
        }

        // Sidebar logic
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // --- NAVBAR TOGGLE ---
        let navbarVisible = localStorage.getItem('navbarVisible') !== 'false';
        const navbar = document.querySelector('.navbar');
        const mainContent = document.querySelector('.main-content');
        const pill = document.getElementById('navTogglePill');
        const pillIcon = document.getElementById('navToggleIcon');

        function applyNavbarState() {
            if (navbarVisible) {
                navbar.classList.remove('navbar-hidden');
                mainContent.classList.remove('nav-hidden');
                pill.classList.add('nav-visible');
                pillIcon.className = 'fas fa-chevron-up';
            } else {
                navbar.classList.add('navbar-hidden');
                mainContent.classList.add('nav-hidden');
                pill.classList.remove('nav-visible');
                pillIcon.className = 'fas fa-chevron-down';
            }
        }

        function toggleNavbar() {
            navbarVisible = !navbarVisible;
            localStorage.setItem('navbarVisible', navbarVisible);
            applyNavbarState();
        }

        applyNavbarState();
        loadMoodFeed();
    </script>
</body>
</html>
