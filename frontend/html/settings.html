<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SnapClone</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none;">
                    <img src="../assets/logo.png" alt="SnapClone Logo" style="width: 30px;">
                    <span>SnapClone</span>
                </a>
            </div>
            <a href="index.html" style="color: white; text-decoration: none;"><i class="fas fa-times"></i></a>
        </nav>

        <main class="main-content">
            <div class="auth-container" style="background: rgba(255,255,255,0.1); color: white;">
                <h2 style="color: white;">Settings</h2>
                
                <div style="margin-bottom: 2rem;">
                    <p style="margin-bottom: 1rem; opacity: 0.8;">Background Color</p>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 1rem;">
                        <div class="color-preset" onclick="setBg('#000000')" style="background: #000; border: 2px solid white; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                        <div class="color-preset" onclick="setBg('#1a1a2e')" style="background: #1a1a2e; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                        <div class="color-preset" onclick="setBg('#2d3436')" style="background: #2d3436; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                        <div class="color-preset" onclick="setBg('#4834d4')" style="background: #4834d4; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                        <div class="color-preset" onclick="setBg('#eb4d4b')" style="background: #eb4d4b; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                        <div class="color-preset" onclick="setBg('#6ab04c')" style="background: #6ab04c; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                    </div>
                    <input type="color" id="customColor" style="width: 100%; height: 40px; border-radius: 10px; border: none; cursor: pointer;" onchange="setBg(this.value)">
                </div>

                <hr style="opacity: 0.1; margin-bottom: 2rem;">

                <button onclick="saveSettings()" style="background: var(--snap-yellow); color: black; margin-bottom: 1rem;">Save Appearance</button>
                
                <button onclick="logout()" class="logout-btn" style="background: var(--snap-red); color: white; width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </main>
    </div>

    <script>
        function applyTheme() {
            const savedColor = localStorage.getItem('app-bg') || '#000000';
            document.documentElement.style.setProperty('--app-bg', savedColor);
            document.getElementById('customColor').value = savedColor;
        }

        function setBg(color) {
            document.documentElement.style.setProperty('--app-bg', color);
            localStorage.setItem('temp-bg', color);
        }

        function saveSettings() {
            const color = localStorage.getItem('temp-bg') || document.getElementById('customColor').value;
            localStorage.setItem('app-bg', color);
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }

        applyTheme();
    </script>
</body>
</html>
