<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SnapClone</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" style="color: white; text-decoration: none;"><i class="fas fa-chevron-left"></i> Settings</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="auth-container" style="background: rgba(255,255,255,0.1); color: white;">
                <h2 style="color: white;">Appearance</h2>
                <p style="margin-bottom: 2rem; opacity: 0.8;">Choose your premium background color</p>
                
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 2rem;">
                    <div class="color-preset" onclick="setBg('#000000')" style="background: #000; border: 2px solid white; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                    <div class="color-preset" onclick="setBg('#1a1a2e')" style="background: #1a1a2e; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                    <div class="color-preset" onclick="setBg('#2d3436')" style="background: #2d3436; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                    <div class="color-preset" onclick="setBg('#4834d4')" style="background: #4834d4; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                    <div class="color-preset" onclick="setBg('#eb4d4b')" style="background: #eb4d4b; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                    <div class="color-preset" onclick="setBg('#6ab04c')" style="background: #6ab04c; height: 50px; border-radius: 12px; cursor: pointer;"></div>
                </div>

                <div class="input-group">
                    <p style="font-size: 0.8rem; margin-bottom: 10px;">Or pick a custom hex color:</p>
                    <input type="color" id="customColor" style="height: 50px; padding: 5px; cursor: pointer;" onchange="setBg(this.value)">
                </div>

                <button onclick="saveSettings()" style="background: var(--snap-yellow); color: black;">Save Changes</button>
            </div>
        </main>
    </div>

    <script>
        // Theme Helper Logic
        function applyTheme() {
            const savedColor = localStorage.getItem('app-bg') || '#000000';
            document.documentElement.style.setProperty('--app-bg', savedColor);
            document.getElementById('customColor').value = savedColor;
        }

        function setBg(color) {
            document.documentElement.style.setProperty('--app-bg', color);
            localStorage.setItem('temp-bg', color); // Save temporarily before confirmation
        }

        function saveSettings() {
            const color = localStorage.getItem('temp-bg') || document.getElementById('customColor').value;
            localStorage.setItem('app-bg', color);
            alert('Settings saved!');
            window.location.href = 'index.html';
        }

        applyTheme();
    </script>
</body>
</html>
